name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fix-tests:
    # Warns (never fails) when a fix commit in the pull request changes no test.
    name: Fix commits carry tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-fix-tests.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  java-plugin:
    name: Gephi plugin (JUnit + checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        working-directory: gephi-ai-plugin
        run: mvn -B test

  mcp-server:
    name: MCP server (pytest + ruff, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the requires-python floor; 3.14 is the newest version a Desktop bundle
        # install can resolve.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: mcp-server
        # Editable install so pyproject.toml stays the single source of truth for
        # runtime deps + [dev] extras — a hand-maintained list here drifts (defusedxml
        # was missed when the viewer landed).
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: mcp-server
        run: ruff check .
      - name: Test
        working-directory: mcp-server
        run: python -m pytest -q

  desktop-bundle:
    name: Desktop bundle entry point (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Smoke-test the bundle over stdio
        # The test launches the bundle with the manifest's uv command, as Claude Desktop does.
        # The variable turns a missing uv from a skip into a failure on every runner.
        env:
          GEPHI_AI_REQUIRE_BUNDLE_SMOKE: '1'
        run: uv run --directory mcp-server --extra dev python -m pytest -q -rs tests/test_bundle_smoke.py
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '20'
      - name: Build the bundle for real and check what it ships
        # Runs scripts/build-mcpb.sh with real uv and npx in a temp copy. The test reaches the
        # network, so it runs only when the variable is set, and then it fails rather than skips.
        if: runner.os == 'Linux'
        env:
          GEPHI_AI_REQUIRE_REAL_BUILD: '1'
        run: uv run --directory mcp-server --extra dev python -m pytest -q -rs tests/test_release_scripts.py -k real_build

  codex-plugin:
    name: Codex plugin (manifest + parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: pip install PyYAML
      - name: Validate package and Claude-to-Codex parity
        run: python -m unittest discover -s plugins/gephi-network-analysis/tests -v
