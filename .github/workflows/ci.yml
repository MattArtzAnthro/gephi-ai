name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  java-plugin:
    name: Gephi plugin (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        working-directory: gephi-ai-plugin
        run: mvn -B test

  mcp-server:
    name: MCP server (pytest + ruff, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the requires-python floor; 3.14 is what a fresh Desktop bundle install
        # resolves today.
        python-version: ['3.10', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: mcp-server
        # Editable install so pyproject.toml stays the single source of truth for
        # runtime deps + [dev] extras — a hand-maintained list here drifts (defusedxml
        # was missed when the viewer landed).
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: mcp-server
        run: ruff check .
      - name: Test
        working-directory: mcp-server
        run: python -m pytest -q

  desktop-bundle:
    name: Desktop bundle entry point (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Smoke-test the bundle over stdio
        # The test launches the bundle with uv, as Claude Desktop does, so uv must be on PATH
        # here or the test skips.
        run: uv run --directory mcp-server --extra dev python -m pytest -q tests/test_bundle_smoke.py

  codex-plugin:
    name: Codex plugin (manifest + parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: pip install PyYAML
      - name: Validate package and Claude-to-Codex parity
        run: python -m unittest discover -s plugins/gephi-network-analysis/tests -v
