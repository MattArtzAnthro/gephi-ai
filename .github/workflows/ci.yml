name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-tests:
    # Warns (never fails) when a fix commit in the pull request changes no test.
    name: Fix commits carry tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-fix-tests.sh "$BASE_SHA" "$HEAD_SHA"

  java-plugin:
    name: Gephi plugin (JUnit + checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests and the coverage floor
        # JaCoCo's check runs in the test phase and fails below the floors set in pom.xml.
        working-directory: gephi-ai-plugin
        run: mvn -B test

  mcp-server:
    name: MCP server (pytest, ruff, mypy, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the requires-python floor; 3.14 is the newest version a Desktop bundle
        # install can resolve.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: mcp-server
        # Editable install so pyproject.toml stays the single source of truth for
        # runtime deps + [dev] extras — a hand-maintained list here drifts (defusedxml
        # was missed when the viewer landed).
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: mcp-server
        run: ruff check . ../plugins/gephi-network-analysis/tests
      - name: Security lint
        # Once: the code is the same on every Python; skips are in [tool.bandit].
        if: matrix.python-version == '3.12'
        working-directory: mcp-server
        run: bandit -q -c pyproject.toml -r .
      - name: Type check
        # Once: mypy checks against 3.12 on every runner (see [tool.mypy] in pyproject.toml).
        if: matrix.python-version == '3.12'
        working-directory: mcp-server
        # The viewer package is named: imported only through the editable install, mypy treats
        # it as a site package and silences its errors.
        run: mypy ./*.py gephi_mcp_viewer
      - name: Test
        if: matrix.python-version != '3.12'
        working-directory: mcp-server
        run: python -m pytest -q
      - name: Test with the coverage floor
        # Once: coverage is measured on 3.12 and fails below fail_under in pyproject.toml.
        if: matrix.python-version == '3.12'
        working-directory: mcp-server
        run: python -m pytest -q --cov --cov-report=term

  scripts:
    name: Scripts and workflows (shellcheck, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh scripts/*.sh plugins/claude-code/scripts/*.sh
      - name: Gephi check hook blocks when Gephi is down and allows when it is up
        run: bash plugins/claude-code/scripts/test-check-gephi.sh
      - run: pip install actionlint-py==1.7.12.25 && actionlint

  desktop-bundle:
    name: Desktop bundle entry point (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a commit because it is a third-party action.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Smoke-test the bundle over stdio
        # The test launches the bundle with the manifest's uv command, as Claude Desktop does.
        # The variable turns a missing uv from a skip into a failure on every runner.
        env:
          GEPHI_AI_REQUIRE_BUNDLE_SMOKE: '1'
        run: uv run --directory mcp-server --extra dev python -m pytest -q -rs tests/test_bundle_smoke.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: '20'
      - name: Build the bundle for real and check what it ships
        # Runs scripts/build-mcpb.sh with real uv and npx in a temp copy. The test reaches the
        # network, so it runs only when the variable is set, and then it fails rather than skips.
        if: runner.os == 'Linux'
        env:
          GEPHI_AI_REQUIRE_REAL_BUILD: '1'
        run: uv run --directory mcp-server --extra dev python -m pytest -q -rs tests/test_release_scripts.py -k real_build

  codex-plugin:
    name: Codex plugin (manifest + parity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: pip install PyYAML==6.0.3
      - name: Validate package and Claude-to-Codex parity
        run: python -m unittest discover -s plugins/gephi-network-analysis/tests -v
