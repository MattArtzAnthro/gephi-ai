name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  java-plugin:
    name: Gephi plugin (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        working-directory: gephi-mcp-plugin
        run: mvn -B test

  mcp-server:
    name: MCP server (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: mcp-server
        # Install runtime + dev deps only (not the package itself) so CI never depends on
        # the build backend; `python -m pytest` puts the cwd on sys.path to import gephi_mcp.
        run: pip install mcp httpx pytest pytest-asyncio ruff
      - name: Lint
        working-directory: mcp-server
        run: ruff check .
      - name: Test
        working-directory: mcp-server
        run: python -m pytest -q
