name: Installers

# The one-command installers (install.sh, install.ps1) run end to end against a
# real Gephi on each platform: install the plugin, then (with --open-gephi)
# open Gephi and require the plugin to answer; re-run (must change nothing)
# and uninstall. The runners
# have no AI assistant installed, so the assistant steps are covered by the
# sandboxed local runs described in the pull request, not here.

on:
  push:
    paths: [install.sh, install.ps1, latest.json, scripts/test-installer.sh, scripts/install.Tests.ps1, .github/workflows/installers.yml]
  pull_request:
    paths: [install.sh, install.ps1, latest.json, scripts/test-installer.sh, scripts/install.Tests.ps1, .github/workflows/installers.yml]
  # A published release is installed end to end at once, and its .nbm checked against latest.json.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GEPHI_VERSION: 0.11.4

jobs:
  lint:
    name: Lint and unit tests (shellcheck, PSScriptAnalyzer, parser, Pester)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh scripts/test-installer.sh
      - name: latest.json's plugin checksum matches the release's .nbm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r server nbm sha < <(python3 -c "import json; d = json.load(open('latest.json')); print(d['server'], d['nbm'], d.get('nbm_sha256') or '-')")
          # The release is cut after the push that bumps latest.json; until then there is nothing to
          # compare. Any other failure (a rate limit, a GitHub error) fails the check.
          if ! digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$server" --jq ".assets[] | select(.name == \"gephi-ai-$nbm.nbm\") | .digest // \"\"" 2>gh-error.txt); then
            cat gh-error.txt
            if grep -q "HTTP 404" gh-error.txt && [ "$GITHUB_EVENT_NAME" != release ]; then
              echo "No release v$server yet; nothing to compare."; exit 0
            fi
            echo "::error::could not read release v$server"; exit 1
          fi
          [ -n "$digest" ] || { echo "::error::release v$server has no gephi-ai-$nbm.nbm, or GitHub recorded no digest for it"; exit 1; }
          if [ "$digest" != "sha256:$sha" ]; then
            echo "::error::latest.json nbm_sha256 is '$sha' but the release's gephi-ai-$nbm.nbm is $digest; installs that fall back to latest.json would refuse it"
            exit 1
          fi
          echo "latest.json nbm_sha256 matches gephi-ai-$nbm.nbm in release v$server"
      - name: install.sh unit tests
        run: bash scripts/test-installer.sh
      - name: PSScriptAnalyzer, errors only
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }
      - name: Parse install.ps1 and the Pester file; any parse error fails
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in "install.ps1", "scripts/install.Tests.ps1") {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
              foreach ($e in $errors) { Write-Host "$f`:$($e.Extent.StartLineNumber): $($e.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }
      - name: install.ps1 unit tests (Pester)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 6.2.0
          $result = Invoke-Pester -Path scripts/install.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.TotalCount -eq 0) { exit 1 }

  linux:
    name: Linux (official tarball, virtual display)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Gephi from the official tarball
        run: |
          curl -fsSL -o /tmp/gephi.tgz "https://github.com/gephi/gephi/releases/download/v$GEPHI_VERSION/gephi-$GEPHI_VERSION-linux-x64.tar.gz"
          tar -xzf /tmp/gephi.tgz -C "$HOME"
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
      # Resolve the release once, so a release published mid-run cannot make the
      # re-run install a different version than the first run.
      - name: Resolve the release to install
        env:
          GH_TOKEN: ${{ github.token }}
          # Set when a published release started the run: test that release, not the latest one.
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=${PUBLISHED_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          test -n "$tag"
          echo "REL_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Install; Gephi must answer with the plugin
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a bash install.sh --yes --open-gephi --version "$REL_VERSION" | tee install.log
      - run: grep -q "Gephi answers on 127.0.0.1:8080" install.log
      - name: Re-run changes nothing
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run -a bash install.sh --yes --version "$REL_VERSION" | tee rerun.log && grep -q "already current" rerun.log
      - name: Uninstall removes the plugin
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install.sh --uninstall --yes
          test ! -e "$HOME/.gephi/0.11/modules/org-gephi-plugins-gephi-ai.jar"

  macos:
    name: macOS (installer brings Gephi with Homebrew)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Gephi preinstalled: the installer's own Homebrew path installs it.
      - name: Resolve the release to install
        env:
          GH_TOKEN: ${{ github.token }}
          # Set when a published release started the run: test that release, not the latest one.
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=${PUBLISHED_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          test -n "$tag"
          echo "REL_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Install Gephi and the plugin
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash install.sh --yes --version "$REL_VERSION" | tee install.log
      # A person clicks Open in macOS's first-open prompt; a runner cannot.
      - run: xattr -dr com.apple.quarantine /Applications/Gephi.app || true
      - name: Re-run changes nothing; Gephi must answer with the plugin
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash install.sh --yes --open-gephi --version "$REL_VERSION" | tee rerun.log
      - run: grep -q "already current" rerun.log && grep -q "Gephi answers on 127.0.0.1:8080" rerun.log
      - name: Uninstall removes the plugin
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install.sh --uninstall --yes
          test ! -e "$HOME/Library/Application Support/gephi/0.11/modules/org-gephi-plugins-gephi-ai.jar"

  windows:
    name: Windows (${{ matrix.shell }}, official installer)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]  # Windows PowerShell 5.1 and PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Gephi silently (Inno Setup)
        run: |
          $exe = "$env:RUNNER_TEMP\gephi-setup.exe"
          Invoke-WebRequest -UseBasicParsing -OutFile $exe "https://github.com/gephi/gephi/releases/download/v$env:GEPHI_VERSION/gephi-$env:GEPHI_VERSION-windows-x64.exe"
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait
      - name: Resolve the release to install
        env:
          GH_TOKEN: ${{ github.token }}
          # Set when a published release started the run: test that release, not the latest one.
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = if ($env:PUBLISHED_TAG) { $env:PUBLISHED_TAG } else { gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName }
          if (-not $tag) { exit 1 }
          "REL_VERSION=$($tag -replace '^v', '')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Run the way the README says to, through a script block, so the test
      # covers the irm | iex path (no file, no exit).
      - name: Install; Gephi must answer with the plugin
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $out = & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Yes -OpenGephi -Version $env:REL_VERSION *>&1 | Out-String
          $out
          if ($out -notmatch "Gephi answers on 127.0.0.1:8080" -or $out -match "\[fail\]") { exit 1 }
      - name: Re-run changes nothing
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Get-Process gephi64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $out = & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Yes -NoLaunch -Version $env:REL_VERSION *>&1 | Out-String
          $out
          if ($out -notmatch "already current") { exit 1 }
      - name: Uninstall removes the plugin
        # Authenticated API calls avoid the 60-an-hour limit shared runners hit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Uninstall -Yes
          if (Test-Path "$env:APPDATA\gephi\0.11\modules\org-gephi-plugins-gephi-ai.jar") { exit 1 }
