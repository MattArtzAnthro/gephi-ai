[project]
name = "gephi-mcp"
version = "1.18.0"
description = "MCP Server for controlling Gephi Desktop via remote API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Matt Artz" }
]
keywords = ["gephi", "mcp", "graph", "network", "visualization", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "mcp>=2.1,<3",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "defusedxml>=0.7.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "nltk>=3.8",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://www.mattartz.me"
Repository = "https://github.com/MattArtzAnthro/gephi-ai"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
gephi-mcp = "gephi_mcp:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Probe verdicts describe one install and must never be published as a claim about
# every install. This exclude lives at the shared [tool.hatch.build] level, not on a
# single target: it was set on the wheel alone, so the wheel was clean while the sdist
# shipped the overlay off disk, and being gitignored does not keep a file out of an
# sdist. Every target inherits it here.
[tool.hatch.build]
exclude = ["caveats.local.json"]

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["caveats.local.json"]

[tool.hatch.build.targets.sdist]
exclude = ["caveats.local.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Linear algebra keeps its conventional single-capital names. A is an adjacency matrix,
# L a Laplacian, R a radius: lowercasing them to satisfy a naming rule would make the
# code harder to check against the papers it implements, which is the wrong trade.
"gephi_mcp_viewer/similarity.py" = ["N803", "N806"]
"gephi_mcp_viewer/community_layout.py" = ["N806"]
"tests/live_smoke_test.py" = ["N806"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
