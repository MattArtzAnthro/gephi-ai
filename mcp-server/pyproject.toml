[project]
name = "gephi-ai"
version = "1.22.1"
description = "MCP Server for controlling Gephi Desktop via remote API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Matt Artz" }
]
keywords = ["gephi", "mcp", "graph", "network", "visualization", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "mcp>=2.1,<3",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "defusedxml>=0.7.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "nltk>=3.8",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://www.mattartz.me"
Repository = "https://github.com/MattArtzAnthro/gephi-ai"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
    "mypy>=2.1,<3",
    # The Codex package test (plugins/gephi-network-analysis/tests) reads skill frontmatter.
    "pyyaml>=6.0",
    "bandit>=1.8",
    "mutmut>=3.2",
]

[project.scripts]
gephi-ai = "gephi_mcp:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Probe verdicts describe one install and must never be published as a claim about
# every install. This exclude lives at the shared [tool.hatch.build] level, not on a
# single target: it was set on the wheel alone, so the wheel was clean while the sdist
# shipped the overlay off disk, and being gitignored does not keep a file out of an
# sdist. Every target inherits it here.
[tool.hatch.build]
exclude = ["caveats.local.json", "mutants"]

[tool.hatch.build.targets.wheel]
# Name what ships rather than `packages = ["."]`, which wrote every member as "./x"
# (PyPI now rejects non-normalized archive paths) and installed tests, pyproject.toml
# and .gitignore into site-packages.
include = ["/*.py", "/caveats.json", "/gephi_mcp_viewer"]
exclude = ["caveats.local.json"]
# Flat layout: the modules sit at the project root, not under a package directory. An
# editable install has to put that root on sys.path explicitly, or `import gephi_mcp`
# resolves only when the shell is already in this directory and fails everywhere else.
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
exclude = ["caveats.local.json", "mutants"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Linear algebra keeps its conventional single-capital names. A is an adjacency matrix,
# L a Laplacian, R a radius: lowercasing them to satisfy a naming rule would make the
# code harder to check against the papers it implements, which is the wrong trade.
"gephi_mcp_viewer/similarity.py" = ["N803", "N806"]
"gephi_mcp_viewer/community_layout.py" = ["N806"]
"tests/live_smoke_test.py" = ["N806"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
# 3.12, not the 3.11 floor: numpy's type stubs use 3.12 syntax and mypy cannot read them at
# 3.11. The floor stays covered by ruff's py311 target and by CI running the tests on 3.11.
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
skip_empty = true
# The floor only moves up. CI fails below it (python -m pytest --cov).
fail_under = 91

[tool.bandit]
# B311: seeded random.Random places nodes in layouts; nothing here is cryptographic.
# B406: xml.sax.saxutils.escape writes escaped SVG for legends; parsing uses defusedxml.
skips = ["B311", "B406"]
exclude_dirs = [".venv", "tests", "dist"]

[tool.mutmut]
# Mutation testing for the modules with real logic: `mutmut run`, then `mutmut results`.
source_paths = ["community_stability.py", "session_ledger.py", "partition_match.py", "graph_diff.py", "stats_integrity.py"]
# The tests that exercise the mutated modules (the repo-level drift tests cannot run in mutmut's copy).
pytest_add_cli_args_test_selection = ["tests/test_mutation_stats_integrity.py", "tests/test_mutation_graph_diff.py", "tests/test_mutation_partition_match.py", "tests/test_mutation_session_ledger.py", "tests/test_mutation_community_stability.py", "tests/test_best_effort_is_logged.py", "tests/test_community_stability_tool.py", "tests/test_community_stability.py", "tests/test_graph_diff.py", "tests/test_legend_tool.py", "tests/test_ledger_survives_snapshot.py", "tests/test_partition_match.py", "tests/test_receipt_across_graphs.py", "tests/test_session_ledger.py", "tests/test_stat_caveat_attachment.py", "tests/test_stats_integrity.py", "tests/test_group_c_tools.py", "tests/test_export_figure_tool.py"]
also_copy = ["bipartite.py", "caveats.json", "community_stability.py", "figure.py", "gephi_mcp.py", "gephi_mcp_viewer", "graph_diff.py", "legend.py", "partition_match.py", "probe_verdicts.py", "pyproject.toml", "session_ledger.py", "stats_integrity.py", "text_network.py"]
